<!DOCTYPE html>
<html lang="es" class="t-participante">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RETO CIDEIC 2026 · Consulta tu grupo</title>
<link rel="stylesheet" href="../base.css">
<script>(function(){var t=null;try{t=localStorage.getItem("cideic_tema")}catch(e){}if(t!=="claro"&&t!=="oscuro")t=window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches?"claro":"oscuro";document.documentElement.setAttribute("data-tema",t)})();</script>
<link rel="stylesheet" href="../tema/fuentes/saira.css">
<link rel="stylesheet" href="../tema/participante.css">
<style>
  /* Solo para el Reto: el número de grupo y el bloque del coach, con los colores del tema */
  .reto-grupo { text-align: center; padding: 6px 0 18px; border-bottom: 1px solid var(--linea); margin-bottom: 16px; }
  .reto-grupo span { display: block; color: var(--tinta-3); font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; }
  .reto-grupo strong { display: block; font-size: clamp(4.5rem, 18vw, 6rem); line-height: 1; font-weight: 700; font-stretch: 87.5%; color: var(--menta); margin: 4px 0; }
  .reto-grupo em { font-style: normal; color: var(--tinta-2); }
  .reto-coach { text-align: center; margin-bottom: 18px; }
  .reto-coach span { display: block; color: var(--tinta-3); font-size: .85rem; letter-spacing: .08em; text-transform: uppercase; }
  .reto-coach strong { font-size: 1.35rem; color: var(--tinta); }
  .reto-nota { text-align: center; color: var(--tinta-2); font-size: .9rem; margin: 8px 0 14px; }
  a.boton { text-decoration: none; display: block; text-align: center; }
</style>
</head>
<body>
<script>document.body.classList.add('en-inicio');</script>
<!-- Tema CIDEIC · escena decorativa (la misma del sistema de inscripciones) -->
<div class="escena" aria-hidden="true">
  <div class="cuadro">
    <div class="lienzo alto"><div class="capa c-cielo"><i class="v-oscuro"></i><i class="v-claro"></i></div></div>
    <div class="lienzo bajo"><div class="capa c-paisaje"><i class="v-oscuro"><b class="nitida"></b><b class="difusa"></b></i><i class="v-claro"><b class="nitida"></b><b class="difusa"></b></i><i class="aura"></i></div></div>
  </div>
  <div class="velo"></div>
  <div class="escena-logo"><div class="fila-logo v-oscuro"><img class="l-marca" alt="" src="../tema/img/logo-marca-oscuro.webp"><img class="l-linea" alt="" src="../tema/img/logo-linea-oscuro.webp"><img class="l-texto" alt="" src="../tema/img/logo-texto-oscuro.webp"></div><div class="fila-logo v-claro"><img class="l-marca" alt="" src="../tema/img/logo-marca-claro.webp"><img class="l-linea" alt="" src="../tema/img/logo-linea-claro.webp"><img class="l-texto" alt="" src="../tema/img/logo-texto-claro.webp"></div></div>
</div>
<button type="button" class="tema-btn" role="switch" aria-checked="true" aria-label="Modo oscuro" title="Cambiar entre modo claro y oscuro"><span class="tema-pista" aria-hidden="true"><span class="tema-perilla"></span><svg class="i-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M2.5 12h2.2M19.3 12h2.2M5.3 5.3l1.6 1.6M17.1 17.1l1.6 1.6M5.3 18.7l1.6-1.6M17.1 6.9l1.6-1.6"/></svg><svg class="i-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5Z"/></svg></span></button>

<header class="cabecera">
  <div class="contenido">
    <img class="marca v-oscuro" src="../tema/img/cabecera-oscuro.webp" alt="CIDEIC · Congreso Internacional de Estudiantes de Ingeniería Civil" width="510" height="130"><img class="marca v-claro" src="../tema/img/cabecera-claro.webp" alt="CIDEIC · Congreso Internacional de Estudiantes de Ingeniería Civil" width="510" height="130">
    <h1>VII CIDEIC · UCSM</h1>
    <p>RETO CIDEIC 2026</p>
  </div>
</header>

<main class="contenido">
  <!-- Pantalla 1 · consulta -->
  <section class="tarjeta" data-pantalla="1" id="consulta" aria-labelledby="t1">
    <div class="paso">Consulta tu grupo</div>
    <h2 id="t1">Escribe tu documento</h2>
    <form id="f" autocomplete="off" novalidate>
      <label for="doc">DNI, carnet de extranjería o pasaporte</label>
      <input id="doc" maxlength="20" placeholder="Ej.: 45678912" required>
      <button class="boton ancho-total" id="btn" type="submit">Ver mi grupo</button>
    </form>
    <div id="msg" role="status" aria-live="polite"></div>
  </section>

  <!-- Pantalla 2 · tu grupo -->
  <section class="tarjeta" data-pantalla="2" id="resultado" aria-labelledby="t2" hidden>
    <div class="paso">RETO CIDEIC 2026</div>
    <h2 id="t2">¡Ya tienes equipo!</h2>
    <div class="reto-grupo"><span>Perteneces al grupo</span><strong id="r-num">–</strong><em id="r-de">de 16</em></div>
    <div class="reto-coach"><span>Tu coach</span><strong id="r-coach">–</strong></div>
    <a class="boton whatsapp ancho-total" id="r-wa" href="#" target="_blank" rel="noopener">Unirme al grupo de WhatsApp</a>
    <p class="reto-nota">Tu coach aprobará tu ingreso al grupo.</p>
    <button class="boton secundario ancho-total" id="otra" type="button">Consultar otro documento</button>
  </section>
</main>
<footer class="pie" id="pie">¿No apareces o tienes dudas? Escríbenos al WhatsApp <a href="https://wa.me/51927457291" target="_blank" rel="noopener">+51 927 457 291</a></footer>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const hex = (u8) => Array.from(u8, (b) => b.toString(16).padStart(2, '0')).join('');
  let datos = null;

  const normalizar = (s) => {
    let d = (s || '').replace(/[\s.\-]/g, '').toUpperCase();
    if (/^\d+$/.test(d) && d.length < 8) d = d.padStart(8, '0');
    return d;
  };
  const valido = (d) => /^[A-Z0-9]{6,12}$/.test(d) && /\d/.test(d);
  const msg = (t, estilo) => { const m = $('msg'); m.textContent = t || ''; m.className = t ? 'mensaje' : ''; if (t) m.dataset.estilo = estilo || 'info'; else delete m.dataset.estilo; };

  // Los datos se descargan apenas abre la página (no al primer clic). Si la descarga falla, se reintenta al consultar.
  function cargar() {
    if (!datos) datos = fetch('datos.json', { cache: 'no-cache' })
      .then((r) => { if (!r.ok) throw new Error('datos'); return r.json(); })
      .catch((e) => { datos = null; throw e; });
    return datos;
  }
  cargar().catch(() => {});

  async function consultar(doc) {
    const d = await cargar();
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(doc), 'PBKDF2', false, ['deriveBits']);
    const bits = new Uint8Array(await crypto.subtle.deriveBits(
      { name: 'PBKDF2', hash: 'SHA-256', salt: b64(d.sal), iterations: d.iter }, base, 512));
    const entrada = d.e[hex(bits.slice(0, 16))];
    if (!entrada) return null;
    const raw = b64(entrada);
    const llave = await crypto.subtle.importKey('raw', bits.slice(32, 64), 'AES-GCM', false, ['decrypt']);
    const plano = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, llave, raw.slice(12));
    return JSON.parse(new TextDecoder().decode(plano).trim());
  }

  $('f').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const doc = normalizar($('doc').value);
    if (!valido(doc)) return msg('Revisa el número: escribe tu documento sin espacios.', 'error');
    if (!window.crypto || !crypto.subtle) return msg('Tu navegador no permite la consulta. Prueba con otro navegador.', 'error');
    $('btn').disabled = true; msg('Buscando…', 'info');
    try {
      const r = await consultar(doc);
      if (!r) { msg('No encontramos tu DNI. Escríbenos al WhatsApp +51 927 457 291.', 'aviso'); return; }
      $('r-num').textContent = r.g;
      $('r-de').textContent = 'de ' + r.t;
      $('r-coach').textContent = r.c;
      $('r-wa').href = r.w;
      $('consulta').hidden = true;
      $('resultado').hidden = false;
      window.scrollTo(0, 0);
      msg('');
    } catch (e) {
      msg('No pudimos consultar ahora. Revisa tu conexión y vuelve a intentarlo.', 'aviso');
    } finally { $('btn').disabled = false; }
  });

  $('otra').addEventListener('click', () => {
    $('resultado').hidden = true; $('consulta').hidden = false;
    $('doc').value = ''; $('doc').focus();
  });
})();
</script>
<script src="../tema/participante.js"></script>
</body>
</html>
