<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>RETO CIDEIC 2026 · Consulta tu grupo</title>
<style>
  :root {
    --fondo: #f4f1ea; --tarjeta: #fffdf8; --texto: #1f2a24; --suave: #5d6b63;
    --verde: #0f4a30; --verde-2: #176b45; --borde: #d9d3c4; --error: #9b2c1f; --wa: #1f8f4e;
  }
  @media (prefers-color-scheme: dark) {
    :root { --fondo: #121815; --tarjeta: #1a221e; --texto: #e8ece9; --suave: #a3b0a9;
            --verde: #7fd0a3; --verde-2: #5fbf8a; --borde: #2e3a34; --error: #ff8a7a; --wa: #2fb36a; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--fondo); color: var(--texto);
         font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; display: flex; justify-content: center; }
  main { width: 100%; max-width: 460px; padding: 32px 16px 48px; }
  .marca { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--suave); margin: 0 0 6px; }
  h1 { margin: 0 0 6px; font-size: 30px; line-height: 1.15; color: var(--verde); }
  .bajada { margin: 0 0 24px; color: var(--suave); }
  .tarjeta { background: var(--tarjeta); border: 1px solid var(--borde); border-radius: 16px; padding: 20px; }
  label { display: block; font-weight: 600; margin-bottom: 8px; }
  input { width: 100%; font: inherit; font-size: 20px; letter-spacing: .04em; padding: 12px 14px; border-radius: 10px;
          border: 1.5px solid var(--borde); background: transparent; color: var(--texto); }
  input:focus { outline: 3px solid color-mix(in srgb, var(--verde-2) 35%, transparent); border-color: var(--verde-2); }
  button { width: 100%; margin-top: 12px; font: inherit; font-weight: 700; padding: 13px; border: 0; border-radius: 10px;
           background: var(--verde); color: var(--tarjeta); cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  .msg { margin: 12px 0 0; min-height: 1.5em; color: var(--suave); }
  .msg.error { color: var(--error); }
  .resultado { display: none; text-align: center; }
  .resultado.ver { display: block; }
  .grupo { font-size: 15px; color: var(--suave); margin: 0; }
  .numero { font-size: 76px; font-weight: 800; line-height: 1; color: var(--verde); margin: 6px 0 2px; }
  .de { color: var(--suave); margin: 0 0 18px; }
  .coach { border-top: 1px solid var(--borde); padding-top: 14px; margin: 0 0 18px; }
  .coach span { display: block; font-size: 13px; text-transform: uppercase; letter-spacing: .1em; color: var(--suave); }
  .coach strong { font-size: 21px; }
  a.wa { display: block; text-decoration: none; font-weight: 700; padding: 14px; border-radius: 10px; background: var(--wa); color: #fff; }
  .nota { font-size: 14px; color: var(--suave); margin: 10px 0 0; }
  .otra { background: transparent; color: var(--verde); border: 1.5px solid var(--borde); }
  footer { margin-top: 24px; font-size: 14px; color: var(--suave); text-align: center; }
</style>
</head>
<body>
<main>
  <p class="marca">VII CIDEIC · UCSM</p>
  <h1>RETO CIDEIC 2026</h1>
  <p class="bajada">Escribe tu DNI y descubre tu grupo, tu coach y el enlace de WhatsApp.</p>

  <section class="tarjeta" id="consulta">
    <form id="f" autocomplete="off">
      <label for="doc">Tu DNI, carnet de extranjería o pasaporte</label>
      <input id="doc" inputmode="text" maxlength="14" placeholder="12345678" required>
      <button id="btn" type="submit">Ver mi grupo</button>
      <p class="msg" id="msg" role="status" aria-live="polite"></p>
    </form>
  </section>

  <section class="tarjeta resultado" id="resultado" aria-live="polite">
    <p class="grupo">Perteneces al grupo</p>
    <p class="numero" id="r-num">–</p>
    <p class="de" id="r-de">de 16</p>
    <p class="coach"><span>Tu coach</span><strong id="r-coach">–</strong></p>
    <a class="wa" id="r-wa" href="#" target="_blank" rel="noopener">Unirme al grupo de WhatsApp</a>
    <p class="nota">Un administrador aprobará tu ingreso.</p>
    <button class="otra" id="otra" type="button">Consultar otro DNI</button>
  </section>

  <footer>¿No apareces o tienes dudas? Escríbenos al WhatsApp +51 927 457 291.</footer>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const hex = (u8) => Array.from(u8, (b) => b.toString(16).padStart(2, '0')).join('');
  let datos = null;

  const normalizar = (s) => {
    let d = (s || '').replace(/[\s.\-]/g, '').toUpperCase();
    if (/^\d+$/.test(d) && d.length < 8) d = d.padStart(8, '0');
    return d;
  };
  const valido = (d) => /^[A-Z0-9]{6,12}$/.test(d) && /\d/.test(d);
  const msg = (t, error) => { $('msg').textContent = t; $('msg').className = 'msg' + (error ? ' error' : ''); };

  async function cargar() {
    if (datos) return datos;
    const r = await fetch('datos.json', { cache: 'no-cache' });
    if (!r.ok) throw new Error('datos');
    return (datos = await r.json());
  }

  async function consultar(doc) {
    const d = await cargar();
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(doc), 'PBKDF2', false, ['deriveBits']);
    const bits = new Uint8Array(await crypto.subtle.deriveBits(
      { name: 'PBKDF2', hash: 'SHA-256', salt: b64(d.sal), iterations: d.iter }, base, 512));
    const entrada = d.e[hex(bits.slice(0, 16))];
    if (!entrada) return null;
    const raw = b64(entrada);
    const llave = await crypto.subtle.importKey('raw', bits.slice(32, 64), 'AES-GCM', false, ['decrypt']);
    const plano = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: raw.slice(0, 12) }, llave, raw.slice(12));
    return JSON.parse(new TextDecoder().decode(plano).trim());
  }

  $('f').addEventListener('submit', async (ev) => {
    ev.preventDefault();
    const doc = normalizar($('doc').value);
    if (!valido(doc)) return msg('Revisa el número: escribe tu documento sin espacios.', true);
    if (!window.crypto || !crypto.subtle) return msg('Tu navegador no permite la consulta. Prueba con otro navegador.', true);
    $('btn').disabled = true; msg('Buscando…');
    try {
      const r = await consultar(doc);
      if (!r) { msg('No encontramos tu DNI. Escríbenos al WhatsApp +51 927 457 291.', true); return; }
      $('r-num').textContent = r.g;
      $('r-de').textContent = 'de ' + r.t;
      $('r-coach').textContent = r.c;
      $('r-wa').href = r.w;
      $('consulta').style.display = 'none';
      $('resultado').classList.add('ver');
      msg('');
    } catch (e) {
      msg('No pudimos consultar ahora. Revisa tu conexión y vuelve a intentarlo.', true);
    } finally { $('btn').disabled = false; }
  });

  $('otra').addEventListener('click', () => {
    $('resultado').classList.remove('ver'); $('consulta').style.display = '';
    $('doc').value = ''; $('doc').focus();
  });
})();
</script>
</body>
</html>
