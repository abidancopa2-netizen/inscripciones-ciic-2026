# Botón para probar el sistema desde GitHub: Actions → "Tester del sistema" → Run workflow.
# Prueba SIEMPRE el proyecto de PRUEBA: variables de repositorio PRUEBA_API_URL y PRUEBA_ANON_KEY, y el secreto ADMIN_KEY
# (la clave del tester de ese proyecto). La página publicada se prueba contra ese proyecto (el tester le inyecta la
# configuración), aunque docs/config.js apunte a producción. Modo "lectura" sirve contra producción: no cambia nada.
name: Tester del sistema

on:
  workflow_dispatch:
    inputs:
      modo:
        description: "completo = prueba todo (la base debe estar en modo PRUEBA) · lectura = no cambia nada (sirve en producción)"
        type: choice
        options: [completo, lectura]
        default: completo
      personas:
        description: "Personas que se inscriben a la vez en la prueba de carga (0 = sin carga)"
        type: string
        default: "150"
      personas_w:
        description: "Bloque W: personas sintéticas que navegan y confirman a la vez, y alerta de saturación (0 = sin el bloque W)"
        type: string
        default: "1000"
      web_url:
        description: "URL de la página (vacía = la de GitHub Pages de este repositorio)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: tester
  cancel-in-progress: false

jobs:
  tester:
    name: Probar el sistema (${{ inputs.modo }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Acciones fijadas por SHA de commit (no por etiqueta, que se puede mover). Versiones con meses de publicadas:
    # checkout v6.1.0 (20/07/2026) · setup-python v6.3.0 (24/06/2026) · upload-artifact v6.0.0 (12/12/2025). Para actualizar:
    # git ls-remote --tags https://github.com/actions/<acción> y usar el SHA del commit de una versión con 2 semanas o más.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803    # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1    # v6.3.0
        with:
          python-version: "3.12"
      - name: Instalar el tester y el navegador
        run: |
          pip install -r tester/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Revisar la configuración
        env:
          PRUEBA_API_URL: ${{ vars.PRUEBA_API_URL }}
          PRUEBA_ANON_KEY: ${{ vars.PRUEBA_ANON_KEY }}
        run: |
          if [ -z "$PRUEBA_API_URL" ] || [ -z "$PRUEBA_ANON_KEY" ]; then
            echo "::error::Faltan las variables PRUEBA_API_URL y PRUEBA_ANON_KEY (Settings → Secrets and variables → Actions → Variables)."; exit 1
          fi
      - name: Ejecutar el tester
        env:
          API_URL: ${{ vars.PRUEBA_API_URL }}
          ANON_KEY: ${{ vars.PRUEBA_ANON_KEY }}
          MODO: ${{ inputs.modo }}
          CARGA_PERSONAS: ${{ inputs.personas }}
          CARGA_W: ${{ inputs.personas_w }}
          ADMIN_KEY: ${{ secrets.ADMIN_KEY }}
          WEB_URL: ${{ inputs.web_url != '' && inputs.web_url || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
        run: python tester/tester.py --salida resultados
      # Solo el reporte: las capturas del navegador muestran nombres, correos y celulares, y este repositorio es público.
      - name: Guardar el reporte (sin capturas)
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f    # v6.0.0
        with:
          name: reporte-tester
          path: |
            resultados/reporte.md
            resultados/resultados.json
          retention-days: 7
      - name: Borrar las capturas del servidor de GitHub
        if: always()
        run: rm -rf resultados/capturas
